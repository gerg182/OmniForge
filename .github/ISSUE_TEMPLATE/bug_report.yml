name: Bug report
description: Report a reproducible OmniForge problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, private media, tokens, or personal paths. Security issues belong in private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: OmniForge version
      placeholder: 1.5.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Media conversion
        - YouTube download
        - PDF or archives
        - Encryption or privacy tools
        - Transcription or Studio
        - Queue or settings
        - Updates or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the visible error and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, URLs, file names, and personal paths before attaching.
