name: Feature request
description: Suggest a focused improvement to OmniForge.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request keeps processing local-first where possible.
        - label: This request does not require bypassing DRM, access controls, or site terms.
